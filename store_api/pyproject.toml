[tool.poetry]
name = "store-api"
version = "1.0.0"
description = "API de produtos em FastAPI + MongoDB desenvolvida com TDD"
authors = ["Yamaia"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110"
uvicorn = { extras = ["standard"], version = ">=0.27" }
motor = "^3.4"
pydantic = "^2.6"
pydantic-settings = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = ">=0.23"
pytest-cov = "^5.0"
httpx = ">=0.27"
mongomock-motor = ">=0.0.29"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
